# Keyless opt-in composition for the Task Contract, enforced Final Gate, and
# shadow-only Progress Observer. The deterministic backend classifies its
# parser, worker, reviewer, and observer requests by their request purpose.

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: task-contract-snapshot-backend
            name: './tests/fixtures/task-contract-snapshot-backend.mjs'
          - id: task-contract
            name: '@deepseek-ai/dsh-experimental-task-contract'
            config:
              mode: enforce
              injectWorkerContext: true
              parserReasoningEffort: low
              parserMaxTokens: 4096
              parserTimeoutMs: 30000
          - id: task-execution-control
            name: '@deepseek-ai/dsh-experimental-task-execution-control'
            config:
              mode: enforce
          - id: final-completeness-review
            name: '@deepseek-ai/dsh-experimental-final-completeness-gate'
            config:
              mode: enforce
              reviewTiming: before-delivery
              maxEvidenceLookupRounds: 1
          - id: progress-integrity-observer
            name: '@deepseek-ai/dsh-experimental-progress-integrity-observer'
