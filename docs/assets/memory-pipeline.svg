<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title desc">
<title id="title">Memory Pipeline · 证据沉淀与按需召回</title><desc id="desc">历史会话经有界并行提取、来源选择、跨会话归并及校验发布，形成摘要、详细记忆和 Skill。显式记忆请求跳过提取。主 Agent 注入摘要后按需检索详情。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<style>
text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #17283e; }
.title { font-size: 29px; font-weight: 700; } .section { font-size: 20px; font-weight: 700; fill: #52657b; }
.head { font-size: 22px; font-weight: 700; } .body { font-size: 18px; } .label { font-size: 17px; fill: #52657b; }
.edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
.data { stroke-dasharray: 6 5; } .native { fill: #f1f5f9; stroke: #94a3b8; } .model { fill: #eaf2ff; stroke: #5386d8; } .runtime { fill: #e9f7f1; stroke: #409b7e; }
</style>
<rect width="1120" height="1010" rx="20" fill="#fff"/>
<text x="40" y="52" class="title">Memory Pipeline · 证据沉淀与按需召回</text>
<rect x="40" y="76" width="16" height="16" class="native"/><text x="65" y="90" class="label">原生 Agent / 会话能力</text>
<rect x="320" y="76" width="16" height="16" class="model"/><text x="345" y="90" class="label">新增模型处理</text>
<rect x="560" y="76" width="16" height="16" class="runtime"/><text x="585" y="90" class="label">程序控制 / 持久状态</text>
<text x="40" y="137" class="section">异步写入 · 提取证据与记忆晋升分开</text>
<g><rect x="40" y="165" width="280" height="125" rx="12" class="native" stroke-width="1.5"/><text x="60" y="198" class="head">历史会话快照</text><text x="60" y="228" class="body">已完成的合格来源</text><text x="60" y="254" class="body">用户原文 + 工具结果</text></g>
<g><rect x="395" y="165" width="320" height="125" rx="12" class="model" stroke-width="1.5"/><text x="415" y="198" class="head">Phase 1 · Extraction</text><text x="415" y="228" class="body">有界并行、脱敏、来源引用</text><text x="415" y="254" class="body">提取偏好 / 纠正 / 验证事实</text></g>
<g><rect x="790" y="165" width="290" height="125" rx="12" class="runtime" stroke-width="1.5"/><text x="810" y="198" class="head">任务级证据</text><text x="810" y="228" class="body">归并素材 + rollout 摘要</text><text x="810" y="254" class="body">保留范围、来源与不确定性</text></g>
<path d="M320 225H395" class="edge"/>
<path d="M715 225H790" class="edge"/>
<g><rect x="40" y="350" width="280" height="125" rx="12" class="runtime" stroke-width="1.5"/><text x="60" y="383" class="head">显式记忆请求</text><text x="60" y="413" class="body">保存记住 / 修改 / 忘记意图</text><text x="60" y="439" class="body">跳过 Phase 1，待后续归并</text></g>
<g><rect x="395" y="350" width="320" height="125" rx="12" class="runtime" stroke-width="1.5"/><text x="415" y="383" class="head">来源选择</text><text x="415" y="413" class="body">按采用次数与时效筛选 Top-N</text><text x="415" y="439" class="body">结合已有记忆与显式请求</text></g>
<path d="M935 290V412H715" class="edge data"/><text x="950" y="333" class="label">有效来源</text>
<path d="M320 412H395" class="edge"/>
<g><rect x="395" y="535" width="320" height="145" rx="12" class="model" stroke-width="1.5"/><text x="415" y="568" class="head">Phase 2 · Consolidation</text><text x="415" y="598" class="body">跨会话合并，保留未决冲突</text><text x="415" y="624" class="body">更新失去支持的记忆</text><text x="415" y="650" class="body">重复且验证过的流程 → Skill</text></g>
<path d="M555 475V535" class="edge"/>
<g><rect x="790" y="535" width="290" height="145" rx="12" class="runtime" stroke-width="1.5"/><text x="810" y="568" class="head">程序校验与发布</text><text x="810" y="598" class="body">引用 / 脱敏 / 格式 / 容量</text><text x="810" y="624" class="body">不可变版本 + 来源追溯</text><text x="810" y="650" class="body">拒绝迟到结果覆盖</text></g>
<path d="M715 607H790" class="edge"/>
<g><rect x="790" y="750" width="290" height="145" rx="12" class="runtime" stroke-width="1.5"/><text x="810" y="783" class="head">分层正式记忆</text><text x="810" y="813" class="body">memory_summary.md · 摘要</text><text x="810" y="839" class="body">MEMORY.md · 详细经验</text><text x="810" y="865" class="body">Skill · 可复用流程</text></g>
<path d="M935 680V750" class="edge"/>
<text x="40" y="733" class="section">读取侧 · 摘要注入 + Agentic RAG</text>
<g><rect x="40" y="770" width="280" height="125" rx="12" class="native" stroke-width="1.5"/><text x="60" y="803" class="head">主 Agent 请求</text><text x="60" y="833" class="body">摘要定位相关经验</text><text x="60" y="859" class="body">当前任务与实际证据优先</text></g>
<g><rect x="395" y="770" width="320" height="125" rx="12" class="runtime" stroke-width="1.5"/><text x="415" y="803" class="head">受限读取</text><text x="415" y="833" class="body">组装请求时注入有界摘要</text><text x="415" y="859" class="body">memory_search / memory_read</text></g>
<path d="M790 810H715" class="edge data"/><text x="733" y="797" class="label">内容</text>
<path d="M395 810H320" class="edge data"/><text x="338" y="797" class="label">摘要</text>
<path d="M320 870H395" class="edge"/><text x="338" y="858" class="label">检索</text>
<text x="40" y="955" class="body">可视化管理：查看、编辑、删除；读取与贡献分别控制。历史记忆不构成执行授权。</text>
</svg>
