<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1180" viewBox="0 0 1120 1180" role="img" aria-labelledby="title desc">
<title id="title">长任务治理 · 意图保持、过程纠偏、交付验收</title><desc id="desc">灰色原生主 Agent 循环由规划、沙箱审批、工具执行和结果反馈组成。蓝色 Parser 解析需求，Observer 按触发窗口查证风险，Reviewer 在 Enforce 下提交前复核。绿色运行时维护需求版本、快照和执行控制。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<style>
text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #17283e; }
.title { font-size: 29px; font-weight: 700; } .section { font-size: 20px; font-weight: 700; fill: #52657b; }
.head { font-size: 22px; font-weight: 700; } .body { font-size: 18px; } .label { font-size: 17px; fill: #52657b; }
.edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
.data { stroke-dasharray: 6 5; } .native { fill: #f1f5f9; stroke: #94a3b8; } .model { fill: #eaf2ff; stroke: #5386d8; } .runtime { fill: #e9f7f1; stroke: #409b7e; }
</style>
<rect width="1120" height="1180" rx="20" fill="#fff"/>
<text x="40" y="52" class="title">长任务治理 · 意图保持、过程纠偏、交付验收</text>
<rect x="40" y="76" width="16" height="16" class="native"/><text x="65" y="90" class="label">原生 Agent / 会话能力</text>
<rect x="320" y="76" width="16" height="16" class="model"/><text x="345" y="90" class="label">新增模型处理</text>
<rect x="560" y="76" width="16" height="16" class="runtime"/><text x="585" y="90" class="label">程序控制 / 持久状态</text>
<g><rect x="40" y="140" width="280" height="110" rx="12" class="native" stroke-width="1.5"/><text x="60" y="173" class="head">用户原文 / 中途反馈</text><text x="60" y="203" class="body">当前消息与批准计划</text></g>
<g><rect x="390" y="140" width="300" height="110" rx="12" class="model" stroke-width="1.5"/><text x="410" y="173" class="head">① Parser · 需求解析</text><text x="410" y="203" class="body">提出 add / revise / cancel</text></g>
<g><rect x="760" y="140" width="320" height="110" rx="12" class="runtime" stroke-width="1.5"/><text x="780" y="173" class="head">版本化需求账本</text><text x="780" y="203" class="body">来源校验、版本更新、持久保存</text></g>
<path d="M320 195H390" class="edge"/>
<path d="M690 195H760" class="edge"/>
<g><rect x="760" y="285" width="320" height="110" rx="12" class="runtime" stroke-width="1.5"/><text x="780" y="318" class="head">精简任务快照</text><text x="780" y="348" class="body">需求 / 计划变化或压缩后恢复</text></g>
<path d="M920 250V285" class="edge"/>
<g><rect x="405" y="285" width="280" height="110" rx="12" class="native" stroke-width="1.5"/><text x="425" y="318" class="head">原生上下文压缩</text><text x="425" y="348" class="body">旧历史压缩，日志保留</text></g>
<path d="M685 340H760" class="edge"/><text x="704" y="327" class="label">恢复</text>
<g><rect x="40" y="320" width="300" height="115" rx="12" class="native" stroke-width="1.5"/><text x="60" y="353" class="head">主 Agent / Worker</text><text x="60" y="383" class="body">规划、生成工具调用与回答</text><text x="60" y="409" class="body">原生 Agent Loop</text></g>
<path d="M760 300H730V270H190V320" class="edge data"/><text x="365" y="263" class="label">当前有效要求</text>
<g><rect x="40" y="480" width="300" height="110" rx="12" class="native" stroke-width="1.5"/><text x="60" y="513" class="head">原有沙箱与审批</text><text x="60" y="543" class="body">按原工具参数与权限执行</text></g>
<path d="M190 435V480" class="edge"/>
<g><rect x="760" y="450" width="320" height="140" rx="12" class="runtime" stroke-width="1.5"/><text x="780" y="483" class="head">执行控制</text><text x="780" y="513" class="body">插话屏障 / 重复 Guard</text><text x="780" y="539" class="body">暂停任务工具，主 Agent 重规划</text><text x="780" y="565" class="body">按原有审批流程恢复执行</text></g>
<path d="M760 535H340" class="edge"/><text x="460" y="523" class="label">实际启动前检查</text>
<g><rect x="40" y="640" width="300" height="110" rx="12" class="native" stroke-width="1.5"/><text x="60" y="673" class="head">任务工具 → 真实结果</text><text x="60" y="703" class="body">文件、测试、服务等结果</text></g>
<path d="M190 590V640" class="edge"/>
<path d="M40 695H18V377H40" class="edge"/>
<g><rect x="760" y="640" width="320" height="110" rx="12" class="model" stroke-width="1.5"/><text x="780" y="673" class="head">② Observer · 进度检查</text><text x="780" y="703" class="body">查证进展与风险，不代替规划</text></g>
<path d="M340 695H760" class="edge"/><text x="393" y="681" class="label">异常信号 / 执行时间窗触发</text>
<path d="M920 640V590" class="edge"/><text x="936" y="621" class="label">风险 → 暂停</text>
<text x="775" y="782" class="label">有进展 → 继续原生主循环</text>
<g><rect x="40" y="840" width="300" height="110" rx="12" class="native" stroke-width="1.5"/><text x="60" y="873" class="head">终结候选回答</text><text x="60" y="903" class="body">未正式提交的最终文本</text></g>
<path d="M340 405H370V895H340" class="edge"/><text x="387" y="822" class="label">主 Agent 尝试交付</text>
<g><rect x="760" y="840" width="320" height="110" rx="12" class="model" stroke-width="1.5"/><text x="780" y="873" class="head">③ Reviewer · 交付复核</text><text x="780" y="903" class="body">逐项核对要求、回答与证据</text></g>
<path d="M340 895H760" class="edge"/><text x="357" y="880" class="label">候选 + 有效需求 / 计划 + 结果入口</text>
<text x="410" y="925" class="label">按需查询冻结 Session 证据</text>
<g><rect x="760" y="1010" width="320" height="125" rx="12" class="runtime" stroke-width="1.5"/><text x="780" y="1043" class="head">校验与缺口分流</text><text x="780" y="1073" class="body">版本、引用、证据新鲜度</text><text x="780" y="1099" class="body">提交 / 改写 / 核验 / 补做 / 暂停</text></g>
<path d="M920 950V1010" class="edge"/>
<g><rect x="40" y="1010" width="300" height="125" rx="12" class="native" stroke-width="1.5"/><text x="60" y="1043" class="head">正式交付</text><text x="60" y="1073" class="body">提交后登记通过的完成证据</text><text x="60" y="1099" class="body">真实阻塞不标记工作完成</text></g>
<path d="M760 1090H340" class="edge"/><text x="495" y="1077" class="label">允许提交</text>
<path d="M760 1040H720V455H355V350H340" class="edge"/><text x="441" y="1030" class="label">受限补救 → 主 Agent</text>
<text x="40" y="1163" class="label">图示为 Enforce 执行路径；Shadow 仅观察。实线：执行流；虚线：状态输入。</text>
</svg>
